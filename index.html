<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #5A0F03 0%, #1E0501 55%, #120300 100%);
    color: #FFE7C4;
    font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  .meta { margin: 0 0 16px; font-size: 13px; color: #B98F6C; }
  .phone {
    position: relative;
    height: min(932px, calc(100dvh - 150px));
    aspect-ratio: 430 / 932;
    border-radius: 34px;
    overflow: hidden;
    background: #140401;
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 30px 80px rgba(0,0,0,0.65), 0 0 0 8px rgba(255,255,255,0.03);
  }
  .phone iframe { display: block; width: 100%; height: 100%; border: 0; }
  .hint { margin-top: 14px; font-size: 10px; color: #8A6B52; text-align: center; }
  @media (max-width: 720px) {
    body { padding: 0; display: block; }
    h1, .meta, .hint { display: none; }
    .phone {
      height: 100dvh; width: 100vw; aspect-ratio: auto;
      border: 0; border-radius: 0; box-shadow: none;
    }
  }
